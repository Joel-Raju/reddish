name: Release

# Builds platform binaries and attaches them to a GitHub release when a `v*`
# tag is pushed.
#
# Deliberately uses only `gh` and stock shell rather than `cargo-dist`: that
# pulls in a large dependency tree, and the five targets here are all
# buildable natively on GitHub's runner images.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/reddish-tui${{ matrix.ext }}"
          test -x "$BIN" || { echo "binary not found at $BIN"; exit 1; }

          NAME="reddish-tui-${{ matrix.target }}"
          STAGE="$NAME"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp "$BIN" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          mkdir -p "$STAGE/man"
          cp man/redis-tui.1 "$STAGE/man/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd . && zip -qr "$NAME.zip" "$STAGE")
            OUT="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$STAGE"
            OUT="$NAME.tar.gz"
          fi

          # Checksums are generated over the final archives, so a user can
          # verify the download rather than trusting the release page.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
          fi

          rm -rf "$STAGE"
          ls -la "$OUT" "$OUT.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: reddish-tui-${{ matrix.target }}
          path: |
            reddish-tui-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--verify-tag` refuses to create a release for a tag that does not
          # exist, rather than silently inventing one.
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            dist/* \
          || gh release upload "$TAG" dist/* --clobber