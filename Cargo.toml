[package]
name = "reddish-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI Redis client with key browser, value inspector, REPL, pub/sub and stats dashboard"
license = "MIT"
readme = "README.md"
keywords = ["redis", "tui", "terminal", "client", "cli"]
categories = ["command-line-utilities"]
repository = "https://github.com/Joel-Raju/reddish"
homepage = "https://github.com/Joel-Raju/reddish"

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "6.0.0"
futures = "0.3"
indexmap = "2.14.0"
nucleo = "0.5.0"
ratatui = "0.30.0"
regex = "1.12.3"
redis = { version = "0.29", features = ["tokio-comp", "cluster-async", "tokio-native-tls-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sysinfo = "0.38.4"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `openssh`, `anyhow`, `tui-textarea` and `xdg` were removed: none were
# referenced. `openssh` was the important one — it is Unix-only and was the
# sole reason the crate would not compile on Windows at all, despite the CI
# matrix claiming three-OS support.

[dev-dependencies]
clap_mangen = "0.2"
